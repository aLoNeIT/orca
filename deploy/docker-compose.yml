# Orca 自托管一体化部署：relay 与 auth 各自独立镜像/容器 + Caddy（自动 HTTPS）。
#
# 编排只引用镜像名（不做本地编译）——镜像名在 .env 里配置（ORCA_RELAY_IMAGE / ORCA_AUTH_IMAGE），
# 可用私有仓库完整地址（如 swr.cn-east-3.myhuaweicloud.com/team/orca-relay:v1）。
# 镜像构建用 ./build.sh（构建 + 可选 --push），或在别处构建后 docker push / docker save 搬运。
#
# 使用步骤：
#   1. ./init.sh relay.example.com   生成 .env（域名 + 随机密钥 + 镜像名）
#   2. ./build.sh                    构建两个镜像（或在别处构建并推送/搬运）
#   3. docker compose up -d          启动（本文件不含 build，只拉/用已有镜像）
#   4. ./orca-auth user add --email alice@team.com --name "李静"   建号
# 升级：docker compose pull && docker compose up -d（或重新 build.sh 后 up -d）
# 备份：data/ 目录（ORCA_DATA_DIR，含两个 SQLite 库、auth 密钥与证书），直接打包复制即可：
#   tar czf orca-data-$(date +%F).tgz data/

name: orca

services:
  relay:
    image: ${ORCA_RELAY_IMAGE:-orca-relay:latest}
    environment:
      PORT: "8080"
      ORCA_RELAY_ROLE: combined
      ORCA_RELAY_PUBLIC_URL: ${ORCA_RELAY_PUBLIC_URL}
      ORCA_RELAY_CELL_URL: ${ORCA_RELAY_PUBLIC_URL}
      ORCA_RELAY_AUTH_ISSUER: ${ORCA_RELAY_PUBLIC_URL}
      ORCA_RELAY_AUTH_AUDIENCE: orca-relay
      # 跨容器从 auth 拉取验签公钥（jwks 端点由 auth 容器提供）
      ORCA_RELAY_JWKS_URL: http://auth:8080/.well-known/jwks.json
      ORCA_RELAY_ASSIGNMENT_SIGNING_KEY: ${ORCA_RELAY_ASSIGNMENT_SIGNING_KEY}
      # 占位值：官方 Google 身份校验的 admin 路由保持不可用（本部署不用官方运维功能）
      ORCA_RELAY_ADMIN_AUDIENCE: https://admin.invalid
      ORCA_RELAY_DEPLOY_SERVICE_ACCOUNT: nobody@invalid.example
      ORCA_RELAY_DATA_DIR: /data/relay
      # ORCA_RELAY_REGION: us-central1        # 可选：区域标识（默认 us-central1）
      # ORCA_RELAY_CELL_CAPACITY: "900"       # 可选：容量（默认 900，10 人规模无需调整）
    volumes:
      # 数据目录：ORCA_DATA_DIR 可配（相对路径基于本目录），默认 ./data；
      # SQLite（orca-relay.sqlite）直接落在宿主机可见的目录里
      - ${ORCA_DATA_DIR:-./data}/relay:/data/relay
    depends_on:
      - auth
    # 调试端口（仅本机回环）。需要时取消注释：
    # ports:
    #   - "127.0.0.1:8081:8080"
    restart: unless-stopped

  auth:
    image: ${ORCA_AUTH_IMAGE:-orca-auth:latest}
    environment:
      PORT: "8080"
      ORCA_RELAY_PUBLIC_URL: ${ORCA_RELAY_PUBLIC_URL}
      # 反代目标：容器名 relay + 端口 8080
      RELAY_UPSTREAM: relay:8080
      AUTH_DATA_DIR: /data/auth
      # CLI（device list）只读 relay 库用（配对手机数 / 最后活跃）
      ORCA_RELAY_DATA_DIR: /data/relay
      # 组织名（客户端账户显示用）
      ORCA_AUTH_ORG_ID: ${ORCA_AUTH_ORG_ID:-team}
      ORCA_AUTH_ORG_NAME: ${ORCA_AUTH_ORG_NAME:-Team}
    volumes:
      # 账号数据（auth.sqlite / 签名密钥 / 交付信息存档）——落宿主机 data/auth
      - ${ORCA_DATA_DIR:-./data}/auth:/data/auth
      # CLI（device list）只读读 relay 库
      - ${ORCA_DATA_DIR:-./data}/relay:/data/relay:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - auth
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 ACME 状态（caddy 是根运行的官方镜像，直接绑定）
      - ${ORCA_DATA_DIR:-./data}/caddy:/data
      - ${ORCA_DATA_DIR:-./data}/caddy-config:/config
    restart: unless-stopped
