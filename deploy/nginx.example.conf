# Orca Relay · 宿主机 Nginx 反代示例
#
# 把本示例并入宿主机现有 Nginx 配置（按实际域名 / 证书路径 / 端口调整）：
# Nginx 终结 TLS 后，把 https://<你的域名> 的流量转发给 compose 里的 auth 容器。
#
# 三个要点（缺一不可）：
#   1. proxy_pass 指向 .env 里的 ORCA_AUTH_PORT（默认 8080）——auth 是唯一对外入口；
#   2. WebSocket 升级头必须转发 —— /v1/connect 是电脑与手机之间的长连接；
#   3. 必须转发 X-Forwarded-For —— 登录限速按真实客户端 IP 统计（缺了会误伤全员）；
#      并把超时调大 —— 手机端连接会长时间挂住。

# WebSocket 升级映射（放在 http {} 层，通常与 server 同级；已有同名 map 则跳过）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name relay.example.com;              # ← 你的域名（与 ORCA_RELAY_PUBLIC_URL 一致）

    ssl_certificate     /path/to/fullchain.pem; # ← 替换为实际证书
    ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;       # ← ORCA_AUTH_PORT（默认 8080）

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;                 # WebSocket
        proxy_set_header Connection $connection_upgrade;        # WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # 限速按真实 IP
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;               # 长连接（默认 60s 会把 WS 掐断）
        proxy_send_timeout 3600s;
    }
}

# 如需 80 端口跳转 HTTPS（按需并入）：
# server {
#     listen 80;
#     server_name relay.example.com;
#     return 301 https://$host$request_uri;
# }
