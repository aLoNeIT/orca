# Orca Relay · 宿主机 Nginx 反代示例
#
# 用法：
#   1) 下面的 map 段必须放在 http{} 里（Debian/Ubuntu 放 /etc/nginx/conf.d/orca-upgrade.conf）
#   2) server 段放 sites-available 或 conf.d（文件名随意，如 orca.conf）
#   3) 只需改三处：server_name、证书路径、proxy_pass 端口（= .env 的 ORCA_AUTH_PORT）
#   4) nginx -t && systemctl reload nginx
#
# 拓扑：客户端 → Nginx(443, TLS) → auth 容器(127.0.0.1:8080) → relay 容器(容器网络内)
# 注意：8080 不要对公网开放，只让 Nginx 从本机回环访问。

# ---- http 层：WebSocket 升级映射 ----
# 若服务器上已有同名 map（grep -rn connection_upgrade /etc/nginx/），直接复用，别重复定义。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 80：只做跳转，同时给 certbot 留 ACME 校验路径 ----
server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;              # ← 改：你的域名

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：全部流量交给 auth ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1 可加：http2 on;   （老版本写法：listen 443 ssl http2;）
    server_name relay.example.com;              # ← 改：与 ORCA_RELAY_PUBLIC_URL 完全一致

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;  # ← 改
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;    # ← 改
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:OrcaTLS:10m;
    ssl_session_timeout 1h;

    # 手机端截图/附件走这条链路，Nginx 默认 1m 会直接 413
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;       # ← 改：ORCA_AUTH_PORT

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;          # WebSocket 升级（/v1/connect）
        proxy_set_header Connection $connection_upgrade;    # WebSocket 升级
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # 登录限速按真实 IP
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # 手机长连接会挂很久，默认 60s 会掐断
        proxy_send_timeout 3600s;
        proxy_buffering    off;     # 实时数据不攒包
    }
}
